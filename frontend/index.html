<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>minimi chat agent</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --card:#fff; --line:#e7e5e4;
          --accent:#4f46e5; --user:#4f46e5; --warn:#b45309; --ok:#15803d; --err:#b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0c0a09; --fg:#f5f5f4; --muted:#a8a29e; --card:#1c1917; --line:#292524;
            --accent:#818cf8; --user:#4338ca; --warn:#fbbf24; --ok:#4ade80; --err:#f87171; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif;
         display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: center;
           padding: 12px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; }
  button { font: inherit; cursor: pointer; }
  .ghost { background: none; color: var(--muted); border: 1px solid var(--line);
           border-radius: 8px; padding: 4px 12px; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .msg { margin: 0 0 18px; display: flex; flex-direction: column; }
  .msg.user { align-items: flex-end; }
  .bubble { white-space: pre-wrap; overflow-wrap: anywhere; padding: 10px 14px;
            border-radius: 14px; max-width: 92%; }
  .user .bubble { background: var(--user); color: #fff; }
  .assistant .bubble { background: var(--card); border: 1px solid var(--line); }
  .bubble.error { color: var(--err); }
  .status { color: var(--muted); font-size: 14px; margin-bottom: 4px; }
  .status.hidden, .meta:empty { display: none; }
  .meta { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px;
           border: 1px solid currentColor; margin-right: 8px; font-size: 12px; }
  .badge.ok { color: var(--ok); } .badge.warn { color: var(--warn); }
  .sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: 12px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 8px;
          color: var(--fg); text-decoration: none; max-width: 260px; overflow: hidden;
          text-overflow: ellipsis; white-space: nowrap; background: var(--card); }
  .chip:hover { border-color: var(--accent); }
  a.cite { color: var(--accent); text-decoration: none; font-size: 12px; vertical-align: super; }
  .hint { color: var(--muted); text-align: center; margin-top: 12vh; }
  .hint button { margin: 4px; }
  form { border-top: 1px solid var(--line); padding: 12px 20px; }
  .row { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
  textarea { flex: 1; resize: none; font: inherit; padding: 10px 12px; color: var(--fg);
             background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  #send { background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 0 18px; }
  #send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>minimi chat agent</h1>
  <button class="ghost" id="new">New chat</button>
</header>

<main id="chat"><div class="wrap" id="log"></div></main>

<form id="form">
  <div class="row">
    <textarea id="input" rows="2" maxlength="4000" placeholder="Ask anything. Enter to send, Shift+Enter for a new line."></textarea>
    <button id="send" type="submit">Send</button>
  </div>
</form>

<script>
const $ = (s) => document.querySelector(s);
const chat = $("#chat"), log = $("#log"), form = $("#form"), input = $("#input"), sendBtn = $("#send");
const SUGGESTIONS = ["What are the top tech news stories today?", "Who won the most recent F1 race?", "What is 15% of 240?"];
let cid = localStorage.getItem("cid");
let clientId = localStorage.getItem("client");
if (!clientId) { clientId = crypto.randomUUID(); localStorage.setItem("client", clientId); }
let busy = false;

const scrollDown = () => { chat.scrollTop = chat.scrollHeight; };

// ---- building blocks (textContent only, so model output can never inject HTML) ----
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function addUser(text) {
  const m = el("div", "msg user"); m.appendChild(el("div", "bubble", text));
  log.appendChild(m); scrollDown();
}

function addAssistant(text = "") {
  const m = el("div", "msg assistant");
  const status = el("div", "status hidden"), bubble = el("div", "bubble", text);
  const meta = el("div", "meta"), sources = el("div", "sources");
  m.append(status, bubble, meta, sources);
  log.appendChild(m); scrollDown();
  return { status, bubble, meta, sources };
}

function renderAnswer(node, text, sources) {
  const byId = new Map(sources.map((s) => [s.id, s]));
  node.textContent = "";
  for (const part of text.split(/(\[\d{1,2}\])/)) {
    const m = part.match(/^\[(\d{1,2})\]$/);
    const src = m && byId.get(Number(m[1]));
    if (src && /^https?:\/\//.test(src.url)) {
      const a = el("a", "cite", part);
      a.href = src.url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.title = src.title;
      node.appendChild(a);
    } else {
      node.appendChild(document.createTextNode(part));
    }
  }
}

const BADGES = {
  cited: ["ok", "Sources cited"],
  uncited: ["warn", "Searched, but answer not tied to sources"],
  search_failed: ["warn", "Web search failed: unverified"],
};

function renderMeta(ui, d) {
  const b = BADGES[d.grounding];
  if (b) ui.meta.appendChild(el("span", `badge ${b[0]}`, b[1]));
  const secs = (ms) => (ms / 1000).toFixed(1) + "s";
  const t = [secs(d.latency_ms)];
  if (d.first_token_ms != null) t.push("first word " + secs(d.first_token_ms));
  ui.meta.appendChild(document.createTextNode(t.join(" · ")));
  for (const s of d.sources) {
    if (!/^https?:\/\//.test(s.url)) continue;
    const a = el("a", "chip", `[${s.id}] ${s.title || s.url}`);
    a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    ui.sources.appendChild(a);
  }
}

// ---- reading the Server-Sent Events stream ----
async function streamChat(message, handlers) {
  const res = await fetch("/chat/stream", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message, conversation_id: cid, client_id: clientId }),
  });
  if (!res.ok) {
    throw new Error(res.status === 422 ? "Message is empty or too long."
      : res.status === 429 ? "Too many requests. Please wait a minute."
      : `Request failed (${res.status}).`);
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) !== -1) {      // one full frame = one event
      const frame = buf.slice(0, i); buf = buf.slice(i + 2);
      let event = "message", data = "";
      for (const line of frame.split("\n")) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        else if (line.startsWith("data:")) data += line.slice(5).trim();
      }
      if (data) handlers[event]?.(JSON.parse(data));
    }
  }
}

// ---- sending a message ----
async function send(message) {
  busy = true; sendBtn.disabled = true;
  $(".hint")?.remove();
  addUser(message);
  const ui = addAssistant();
  ui.status.textContent = "Thinking…"; ui.status.classList.remove("hidden");
  let text = "", finished = false;

  try {
    await streamChat(message, {
      start: (d) => { cid = d.conversation_id; localStorage.setItem("cid", cid); },
      token: (d) => {
        ui.status.classList.add("hidden");
        text += d.text; ui.bubble.textContent = text; scrollDown();
      },
      searching: (d) => {
        text = ""; ui.bubble.textContent = "";   // anything said before a search was just a preamble
        ui.status.textContent = "Searching the web: " + d.queries.join(" · ");
        ui.status.classList.remove("hidden");
      },
      done: (d) => {
        finished = true;
        ui.status.classList.add("hidden");
        renderAnswer(ui.bubble, d.answer, d.sources);
        renderMeta(ui, d); scrollDown();
      },
      error: (d) => { finished = true; ui.status.classList.add("hidden"); ui.bubble.textContent = d.message; ui.bubble.classList.add("error"); },
    });
    if (!finished) throw new Error("The connection closed before the answer finished.");
  } catch (err) {
    ui.status.classList.add("hidden");
    ui.bubble.textContent = err.message || "Something went wrong.";
    ui.bubble.classList.add("error");
  } finally {
    busy = false; sendBtn.disabled = false; input.focus();
  }
}

// ---- wiring ----
form.addEventListener("submit", (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message || busy) return;
  input.value = "";
  send(message);
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

function showHint() {
  const h = el("div", "hint");
  h.appendChild(el("p", "", "Ask me something. I search the web when I need to."));
  for (const s of SUGGESTIONS) {
    const b = el("button", "ghost", s);
    b.onclick = () => { if (!busy) send(s); };
    h.appendChild(b);
  }
  log.appendChild(h);
}

$("#new").addEventListener("click", () => {
  if (busy) return;
  cid = null; localStorage.removeItem("cid"); log.textContent = ""; showHint();
});

async function restore() {
  if (!cid) return showHint();
  try {
    const res = await fetch(`/conversations/${encodeURIComponent(cid)}/messages?limit=50`);
    if (!res.ok) throw new Error();
    const { messages } = await res.json();
    for (const m of messages) {
      if (m.role === "user") addUser(m.content);
      else addAssistant(m.content);
    }
  } catch {
    cid = null; localStorage.removeItem("cid"); showHint();
  }
}
restore();
</script>
</body>
</html>
